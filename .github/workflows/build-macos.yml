name: Build macOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64   # Apple Silicon (M1/M2/M3/M4)
            runner: macos-15
          - arch: x64     # Intel 芯片 Mac
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Dwell Monitor.app
        run: bash dist/macos/build_macos.sh

      - name: Rename zip with arch
        run: mv dist/macos/dwell_monitor_macos.zip dist/macos/dwell_monitor_macos_${{ matrix.arch }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dwell_monitor_macos_${{ matrix.arch }}
          path: dist/macos/dwell_monitor_macos_${{ matrix.arch }}.zip
          if-no-files-found: error
